# ============================================================
# quantd 配置文件
# 格式: key = value，'#' 为注释。标的后缀: .SH/.SZ/.BJ=A股
# .HK=港股 .US=美股
# ============================================================

# ---------- 市场/网关 ----------
# 网关类型: paper(模拟撮合) | qmt(A股实盘) | futu(港美股实盘) | longport
# 实盘需先装配桥进程，见 README.md「实盘接入」
market.cn.enable = true
market.hk.enable = true
market.us.enable = false          # 美股预留（境内接入受限，确认合规后打开）

gateway.cn = paper
gateway.hk = paper
gateway.us = paper

# ---------- 账户与风控 ----------
# 分币种独立记账（模拟各市场独立资金账户），权益按汇率折CNY合并
account.capital_cny = 1000000     # 人民币账户（A股）
account.capital_hkd = 200000      # 港币账户（港股）
account.capital_usd = 0           # 美元账户（美股，启用时再注入）

risk.max_order_value_cny = 300000 # 单笔委托上限（折CNY）
risk.max_position_value_cny = 500000  # 单标的持仓市值上限
risk.max_total_exposure = 0.8     # 总仓位/总权益 上限
risk.max_price_deviation = 0.15   # 限价单相对昨收最大偏离
risk.max_orders_per_day = 20      # 单日最大委托笔数

# ---------- 汇率（折算CNY记账用；生产应接实时汇率源）----------
fx.hkd_cny = 0.92
fx.usd_cny = 7.10

# ---------- 模拟行情（GBM 随机游走，固定种子可复现）----------
sim.start.year = 2026
sim.start.month = 10
sim.start.day = 20
sim.days = 60                     # 模拟交易日数
sim.seed = 42

paper.slippage_bps = 5            # 滑点 0.05%

# ---------- 交易标的池 ----------
universe = 600519.SH, 000001.SZ, 00700.HK

# 各标的行情参数（初始价/年化波动/年化漂移/日均量）
sim.600519.SH.price = 1450
sim.600519.SH.vol = 0.22
sim.600519.SH.drift = 0.05
sim.600519.SH.volume = 3000000

sim.000001.SZ.price = 11.5
sim.000001.SZ.vol = 0.28
sim.000001.SZ.drift = 0.03
sim.000001.SZ.volume = 90000000

sim.00700.HK.price = 420
sim.00700.HK.vol = 0.30
sim.00700.HK.drift = 0.08
sim.00700.HK.volume = 15000000

# ---------- 策略 ----------
strategy = dual_ma                # 当前内置: dual_ma
strategy.fast = 5                 # 快线周期（日）
strategy.slow = 20                # 慢线周期（日）
strategy.position_ratio = 0.2     # 单标的仓位占总权益比

# ---------- 实盘（live）安全配置 ----------
# 注意：只要 gateway.* 用了 qmt/futu，以下保险丝全部生效
live.i_confirm_real_money = false  # 真钱开关！未确认时实盘网关自动降级为影子模式
live.shadow = true                 # 影子模式：连接/对账真实执行，委托被拦截（验收用）
live.max_order_value_cny = 5000    # 单笔委托硬上限（折CNY），首次实盘强烈建议 ≤5000
live.daily_loss_limit_cny = 1000   # 当日亏损熔断（权益较当日开盘回撤），0=关闭

# 实盘桥地址（桥进程需先启动，见 scripts/live/）
gateway.qmt.host = 127.0.0.1
gateway.qmt.port = 17001
gateway.futu.host = 127.0.0.1
gateway.futu.port = 17002

# ---------- 输出 ----------
report.dir = output
log.debug = false
