# ============================================================
# quantd 实盘通道联调配置（配合 scripts/live/mock_bridge.py）
#
# 用途：在没有 QMT/券商环境时，验证引擎↔桥的完整实盘通道：
#   1) 启动 mock 桥:  python3 scripts/live/mock_bridge.py --port 17001
#   2) 运行:          ./build/quantd config/quantd_live_mock.conf
#
# mock 桥模拟账户：现金 200,000 CNY + 持仓 600519.SH x100
# 引擎将以券商(mock)对账数据为事实源，忽略 account.capital_*
# ============================================================

# 只有 A股走实盘通道（mock），港股保持纸面
market.cn.enable = true
market.hk.enable = true
market.us.enable = false

gateway.cn = qmt          # 实盘通道（此处连 mock 桥）
gateway.hk = paper

gateway.qmt.host = 127.0.0.1
gateway.qmt.port = 17001

# ---- 安全开关（联调阶段保持影子模式）----
live.i_confirm_real_money = false   # 影子验收通过后，联调成交可临时改 true
live.shadow = true                  # true=拦截委托；false=委托发给桥（mock 模拟成交）
live.max_order_value_cny = 5000
live.daily_loss_limit_cny = 1000

# 纸面账户（港股部分）
account.capital_hkd = 100000

# 风控（与实盘共用，均为折CNY）
# 注意：对账持仓茅台 x100 已占总权益 ~43%，总仓位上限须 >43% 才能演示新买单
risk.max_order_value_cny = 5000
risk.max_position_value_cny = 20000
risk.max_total_exposure = 0.6
risk.max_price_deviation = 0.15
risk.max_orders_per_day = 5

fx.hkd_cny = 0.92
fx.usd_cny = 7.10

# 行情仍用模拟源驱动（联调通道用；真实行情接入是下一里程碑）
sim.start.year = 2026
sim.start.month = 10
sim.start.day = 20
sim.days = 40
sim.seed = 42

universe = 000001.SZ, 600519.SH

# 低价股：单笔可控制在保险丝 5000 以内（茅台 1400元/股 1手就14万，
# 必然被保险丝拦截——上面那次运行正是保险丝的正确行为演示）
sim.000001.SZ.price = 11.5
sim.000001.SZ.vol = 0.25
sim.000001.SZ.drift = 0.05
sim.000001.SZ.volume = 80000000

sim.600519.SH.price = 1400
sim.600519.SH.vol = 0.2
sim.600519.SH.drift = 0.05
sim.600519.SH.volume = 2000000

strategy = dual_ma
strategy.fast = 5
strategy.slow = 10
strategy.position_ratio = 0.012   # 超小仓位：单笔 ~4000 CNY < 保险丝 5000

report.dir = output_live_mock
log.debug = false
